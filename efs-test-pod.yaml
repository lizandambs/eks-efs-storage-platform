apiVersion: v1
kind: Pod
metadata:
  name: efs-test
  namespace: storage-test
spec:
  containers:
    - name: test
      image: nginx:latest
      volumeMounts:
        - name: efs-storage
          mountPath: /usr/share/nginx/html
  volumes:
    - name: efs-storage
      persistentVolumeClaim:
        claimName: efs-test-pvc
